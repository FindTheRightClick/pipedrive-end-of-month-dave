name: Deploy on Push

on:
  push:
    branches:
      - main  # or whatever branch you want to trigger on

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run deploy script
        run: powershell -ExecutionPolicy Bypass -File .\deploy.ps1
